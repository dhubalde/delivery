  <rect width="200" height="44" rx="8" fill="white" opacity="0"/>
  <text x="22" y="22" text-anchor="middle" dominant-baseline="central" font-family="Comfortaa, sans-serif" font-size="26" font-weight="700" class="label" aria-hidden="true">W</text>
