# nginx.conf — Producción path-based multi-tenant (/Deco, /ice-zone)
# Sin Docker. Un solo dominio, un solo deploy.
# Tu marca: tudelivery.com | Tiendas: tudelivery.com/<slug>

# Upstream Django (Gunicorn)
upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name tudelivery.com www.tudelivery.com;
    # Certbot validará http para generar el cert. Después redirige a https:
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name tudelivery.com www.tudelivery.com;

    # Certificados Let's Encrypt (gratis)
    ssl_certificate /etc/letsencrypt/live/tudelivery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudelivery.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/tudelivery_access.log;
    error_log /var/log/nginx/tudelivery_error.log;

    # Frontend — resultado de `npm run build` en frontend/dist
    root /var/www/tudelivery/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # SPA fallback: /Deco, /ice-zone, /panel, /login -> index.html
    # Importante para Vue Router (path /:slug)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Django — API privada multi-tenant (JWT con merchant_id)
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Timeouts para pedidos largos
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media (logos de Merchant, etc.)
    location /media/ {
        alias /var/www/tudelivery/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        # No pasar por Django
    }

    # Static de Django (si usás collectstatic)
    location /static/ {
        alias /var/www/tudelivery/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
